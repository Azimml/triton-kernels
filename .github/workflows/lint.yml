name: Lint and type check

# CPU-side quality gate: ruff (lint + format) and mypy (advisory). This runs on
# GitHub's standard runners and needs no GPU, complementing the GPU build/test
# workflows that run on Hugging Face Jobs. It intentionally does NOT import or
# execute the Triton kernels (which require CUDA), so it is fast and hermetic.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install --upgrade "ruff>=0.6"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  mypy:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    # Advisory: type errors are surfaced but do not block the merge, because the
    # Triton @jit kernels are dynamically typed by design.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy
        run: python -m pip install --upgrade "mypy>=1.10"
      - name: mypy
        run: mypy
