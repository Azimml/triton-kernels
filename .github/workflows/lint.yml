name: Lint and type check

# CPU-side quality gate: ruff (lint + format) and mypy (advisory). This runs on
# GitHub's standard runners and needs no GPU, complementing the GPU build/test
# workflows that run on Hugging Face Jobs. It intentionally does NOT import or
# execute the Triton kernels (which require CUDA), so it is fast and hermetic.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install --upgrade "ruff>=0.6"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  test-cpu:
    name: pytest (CPU subset)
    runs-on: ubuntu-latest
    # Runs the always-on CPU tests: quantization numerics, the PyTorch reference
    # math (RMSNorm/SwiGLU/W4A16/MoE), and host-side launch heuristics. The GPU
    # kernel tests are skipped via conftest.py because no CUDA device is present,
    # so this job needs no GPU and stays fast and hermetic.
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        # torch CPU wheel + triton (the reference modules live alongside @jit
        # kernels, so triton must import; no GPU is used).
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.1" "triton>=3.0" "pytest>=7.0"
      - name: pytest (CPU only)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: pytest -q

  mypy:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    # Advisory: type errors are surfaced but do not block the merge, because the
    # Triton @jit kernels are dynamically typed by design.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mypy
        run: python -m pip install --upgrade "mypy>=1.10"
      - name: mypy
        run: mypy
